name: Déploiement GitHub Pages

on:
  push:
    # Seule la version validée (main) est publiée : une ancienne branche de travail ne
    # peut plus remplacer le site par une version périmée.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # Seul service accepté par la version publiée (IA et lien famille) : un lien
          # trafiqué vers un autre serveur est refusé. À mettre à jour si l'adresse change.
          VITE_SERVICE_ORIGINS: 'https://cereo-ai-proxy.gdrj46b6ps.workers.dev'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
